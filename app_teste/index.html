<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu App Teste</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }
        main {
            background: white;
            padding: 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px #00000010;
        }
        h1 { color: #171717; }
        p { color: #666; }
        button {
            padding: 12px 24px;
            border: 0;
            border-radius: 8px;
            background: #171717;
            color: white;
            cursor: pointer;
        }
        button:hover { background: #444; }
    </style>
</head>
<body>
    <main>
        <h1>Meu App de Teste</h1>
        <p>Aplicação estática funcionando!</p>
        <button onclick="alert('Tudo funcionando!')">
            Testar aplicação
        </button>
    </main>
</body>
</html>
