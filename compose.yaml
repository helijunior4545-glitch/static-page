services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure a conexão exclusiva do app}
      SECRET_KEY: ${SECRET_KEY:?Configure uma chave secreta}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DEBUG: "false"
      TRUST_PROXY_HTTPS: ${TRUST_PROXY_HTTPS:-false}
      MIGRATE_ON_START: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
