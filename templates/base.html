<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Contact</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#19253b;font-family:system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px}a{color:#6048dc;text-decoration:none}main{margin:40px auto;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}h1{font-size:clamp(36px,4vw,54px);line-height:1.1;letter-spacing:-2px}.tag{color:#684be0;font-size:12px;font-weight:800;letter-spacing:2px}.card{padding:30px;background:white;border:1px solid #e1e5ee;border-radius:24px;box-shadow:0 20px 60px #23385a09}label{display:block;font-weight:600;margin-bottom:8px}input,textarea{display:block;width:100%;padding:12px;border:1px solid #ccd3df;border-radius:10px;font:inherit}input:focus,textarea:focus{outline:3px solid #684be025;border-color:#684be0}button{padding:14px 22px;border:0;border-radius:10px;background:#6048dc;color:white;font:inherit;cursor:pointer;transition:transform .2s,background .2s}button:hover{transform:translateY(-1px);background:#4c34bd}.errorlist{color:#a12636}article{border-top:1px solid #e1e5ee;padding:16px 0;overflow-wrap:anywhere}.message{white-space:pre-wrap}.wide{grid-column:1/-1}.notice{padding:14px;background:#e4f5eb;border-radius:10px}p{line-height:1.7;color:#58657a}@media(max-width:760px){main{grid-template-columns:1fr;gap:20px;margin-top:10px}.card{padding:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><header><a href="{% url 'contact' %}">◈ Studio Contact</a><a href="{% url 'inbox' %}">Área da equipe ↗</a></header><main>{% block content %}{% endblock %}</main></body></html>
